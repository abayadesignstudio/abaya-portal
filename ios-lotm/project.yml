# Life of the Mind — native iPhone app (a shell around https://lotmstudy.org/next/) plus a
# "Save to Commonplace" share extension. Generated with XcodeGen on GitHub's cloud Macs.
name: LifeOfTheMind
options:
  bundleIdPrefix: org.lotmstudy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${LOTM_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
targets:
  LifeOfTheMind:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Life of the Mind
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchTan
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Photograph a page or attach a photo to a post.
        NSPhotoLibraryUsageDescription: Attach photos to posts, chats and your Commonplace.
        NSMicrophoneUsageDescription: Record voice messages in Chat.
        CFBundleURLTypes:
          - CFBundleURLName: org.lotmstudy.app
            CFBundleURLSchemes: [lotm]
        AppIdentifierPrefix: $(AppIdentifierPrefix)
    entitlements:
      path: App/LifeOfTheMind.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)org.lotmstudy.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.lotmstudy.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: LOTM CI App
    dependencies:
      - target: LOTMShare
    scheme: {}
  LOTMShare:
    type: app-extension
    platform: iOS
    sources: [Share, Shared]
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Commonplace
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
            NSExtensionJavaScriptPreprocessingFile: Selection
    entitlements:
      path: Share/LOTMShare.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)org.lotmstudy.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.lotmstudy.app.share
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: LOTM CI Share
