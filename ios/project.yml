# Abaya — native iPhone app for the practice portal.
# The project file is generated from this spec with XcodeGen (on GitHub's cloud Macs), so no Mac is needed here.
name: Abaya
options:
  bundleIdPrefix: com.abayadesignstudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${ABAYA_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
targets:
  Abaya:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Abaya
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Take photos of receipts for expenses.
        NSPhotoLibraryUsageDescription: Attach receipt photos to expenses.
        CFBundleURLTypes:
          - CFBundleURLName: com.abayadesignstudio.portal
            CFBundleURLSchemes: [abaya]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abayadesignstudio.portal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: AbayaWidgets
    scheme: {}
  AbayaWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Abaya Timer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abayadesignstudio.portal.widgets
        TARGETED_DEVICE_FAMILY: "1"
